# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "cc-miracast-ffi"
description = "C interface of the Windows Miracast receiver for the Flutter app (dart:ffi)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `cdylib` = cc_miracast_ffi.dll (loaded by the Flutter app next to cc_ffi.dll).
# `rlib` = a normal library, so `cargo test` and `cargo clippy` can use the crate too.
# Why a separate library and not part of cc-ffi: cc-ffi is the flutter_rust_bridge facade for
# the cross-platform core (WebRTC, H.264). The Miracast receiver is Windows-only, needs the
# `windows` crate and has a different failure mode (it must be possible to ship, load or fail
# without touching the rest of the app). docs/miracast.md, "Design".
[lib]
crate-type = ["cdylib", "rlib"]

# Same lints as the workspace, except `unsafe_code` is `deny` instead of `forbid`: a C
# interface needs raw pointers. Only `src/abi.rs` opts out (with `#![allow(unsafe_code)]`);
# the rest of the crate stays safe.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
cc-miracast.workspace = true
serde.workspace = true
serde_json.workspace = true
