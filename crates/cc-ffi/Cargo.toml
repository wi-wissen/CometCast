# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "cc-ffi"
description = "Stable facade for Swift and Flutter bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `cdylib` = a shared library (libcc_ffi.so / .dylib / .dll) that the Flutter app loads.
# `rlib` = a normal Rust library, so `cargo test` and `cargo clippy` can use the crate too.
[lib]
crate-type = ["cdylib", "rlib"]

# Own lint table instead of `workspace = true`:
# the workspace forbids `unsafe`, but the code that flutter_rust_bridge generates
# (src/frb_generated.rs) needs it to talk to C. So `unsafe_code` is only *denied* here,
# and the generated module opts out explicitly with `#[allow(unsafe_code)]` in lib.rs.
# Hand-written code in this crate must stay free of `unsafe`. Everything else matches
# the workspace table (keep both in sync by hand; Cargo cannot extend a table).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
# `frb_expand` is a cfg name that the flutter_rust_bridge macros check; tell rustc it is known.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
# `h264`: the receiver decodes incoming H.264 (OpenH264 through cc-media) and hands RGBA
# frames to the UI. Without it the receiver still counts packets but shows no picture.
# UNCERTAIN: H.264 patent/licence questions are open, see docs/capture.md ("H.264 licensing").
# Which OpenH264 build mode is used (see docs/capture.md, "H.264 licensing"): `h264-source` builds
# OpenH264 from source (development and CI only, UNCERTAIN patent situation); `h264-libloading`
# loads Cisco's prebuilt library at run time (the variant intended for releases).
default = ["h264-libloading"]
h264 = ["dep:cc-media"]
h264-source = ["h264", "cc-media/h264-source", "cc-sender/h264-source"]
h264-libloading = ["h264", "cc-media/h264-libloading", "cc-sender/h264-libloading", "dep:cc-codec"]

[dependencies]
cc-proto.workspace = true
cc-transport.workspace = true
cc-receiver.workspace = true
cc-sender.workspace = true
cc-capture.workspace = true
cc-files.workspace = true
cc-docs.workspace = true
# Office to PDF on the sender (docs/documents.md). No default features: only the worker spec,
# the checks and the types are needed here, so the pure-Rust engine (Typst) is not linked into
# libcc_ffi.so; the conversion runs in the separate `cc-office-worker` program, which has it
# (the `cc-office-worker` program). The worker must be built in its own cargo invocation
# (apps/flutter/linux/CMakeLists.txt), or feature unification would put the engine back.
cc-office = { path = "../cc-office", default-features = false }
cc-discovery = { path = "../cc-discovery" }
cc-media = { workspace = true, optional = true }
# Download and lookup of Cisco's OpenH264 library (release builds, feature `h264-libloading`).
cc-codec = { workspace = true, optional = true, features = ["download"] }
tokio.workspace = true
# Host name of a received link (WHATWG parser, the same one cc-files uses for validation).
url = "2"
# Pinned exactly: the Dart package of the same version must be used (see apps/flutter/pubspec.yaml).
flutter_rust_bridge = "=2.13.0"

[dev-dependencies]
tempfile = "3"
# The ZIP writer of the cc-office tests is included by path (office.rs tests).
flate2.workspace = true
