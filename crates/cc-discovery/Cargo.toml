[package]
name = "cc-discovery"
description = "Finding servers and receivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
hickory-resolver.workspace = true
# Interfaces of this machine ("is there a local network?"); already a dependency of mdns-sd.
if-addrs = "0.15"
mdns-sd.workspace = true
# Reads the macOS managed-preferences file (a property list).
plist = "1"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK for opening the policy file.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
