[package]
name = "cc-sender"
description = "Sender core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Same meaning as in cc-media. Only a convenience default for `cargo test -p cc-sender`; the
# workspace dependency has default-features = false, so other crates do not get it.
default = ["h264-source"]
h264-source = ["cc-media/h264-source"]
h264-libloading = ["cc-media/h264-libloading"]

[dependencies]
cc-proto.workspace = true
cc-transport.workspace = true
tokio.workspace = true
bytes.workspace = true
thiserror.workspace = true
cc-capture.workspace = true
cc-media.workspace = true
