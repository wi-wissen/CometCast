# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "cc-media"
description = "Video codec traits and an H.264 encoder/decoder (OpenH264)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# UNCERTAIN: which build mode the releases use is an open legal/packaging decision (see
# docs/capture.md, "H.264 licensing"). `h264-source` builds and tests here without a
# download; `h264-libloading` loads Cisco's prebuilt library at run time.
# Consumers inside the workspace use `default-features = false` and choose the feature
# themselves (the CLI decides for releases); this default only serves `cargo test -p cc-media`.
default = ["h264-source"]
h264-source = ["openh264/source"]
h264-libloading = ["openh264/libloading", "dep:cc-codec"]

[dependencies]
openh264.workspace = true
# Only the lookup of the downloaded library (no HTTP client); see H264Backend::from_env.
cc-codec = { workspace = true, optional = true }
thiserror.workspace = true
