# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "cc-docs"
description = "Document rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["worker-bin"]
# Builds the `cc-docs-worker` program (the render worker process). Needed by the tests; an
# application that ships its own worker entry (`cc_docs::worker_main`) can turn it off.
worker-bin = []

[[bin]]
name = "cc-docs-worker"
path = "src/bin/cc-docs-worker.rs"
required-features = ["worker-bin"]

[dependencies]
cc-proto.workspace = true
hayro.workspace = true
png.workspace = true
image-webp.workspace = true
thiserror.workspace = true
# Inflate pre-scan of PDF streams (pure Rust backend, no C code).
flate2 = { workspace = true }

[dev-dependencies]
serde_json.workspace = true
