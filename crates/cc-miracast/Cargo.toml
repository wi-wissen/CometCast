[package]
name = "cc-miracast"
description = "Miracast receiving through the Windows MiracastReceiver API (Windows 11 only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Same lints as the workspace, except `unsafe_code` is `deny` instead of `forbid`: the
# Windows backend needs ONE unsafe call (`RoInitialize`) in `windows_backend.rs`, which
# carries an explicit `#[allow(unsafe_code)]`. Everything else stays safe.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
thiserror.workspace = true

# The official Microsoft Rust bindings for the Windows Runtime. Windows targets only.
# `ApplicationModel_Core` is needed because `CreateSession` is declared with a
# CoreApplicationView parameter (we pass none).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel_Core",
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_Miracast",
    "Media_Playback", # gates the MediaSource type
    "Win32_System_WinRT",
] }
