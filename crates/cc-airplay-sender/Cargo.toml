# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "cc-airplay-sender"
description = "AirPlay sender without FairPlay: discovery, pairing, media links, photos and the screen as an HLS stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Same meaning as in cc-media. Only a convenience default for `cargo test -p cc-airplay-sender`;
# the workspace dependency has default-features = false, so other crates choose themselves.
default = ["h264-source"]
h264-source = ["cc-media/h264-source"]
h264-libloading = ["cc-media/h264-libloading"]

[dependencies]
cc-capture.workspace = true
cc-media.workspace = true
thiserror.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
# mDNS browsing (Apache-2.0 OR MIT).
mdns-sd = "0.21"
# Binary property lists (AirPlay bodies). MIT.
plist = "1"
# SRP-6a needs big integers. MIT OR Apache-2.0.
num-bigint = "0.4"
sha1.workspace = true
sha2 = "0.11"
hkdf = "0.13"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
aes = "0.8"
ctr = "0.9"
aes-gcm = "0.10"

[dev-dependencies]
cc-capture = { workspace = true, features = ["test-support"] }
