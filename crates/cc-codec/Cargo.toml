# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "cc-codec"
description = "Finds, downloads and verifies Cisco's prebuilt OpenH264 library at run time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# The download (HTTPS client, bzip2 decoder). Without it the crate only looks for a library
# that is already on the disk.
download = ["dep:ureq", "dep:bzip2-rs"]

[dependencies]
sha2 = "0.10"
thiserror.workspace = true
dirs = "6"
# HTTPS client with rustls (ring) and the webpki root store; no OpenSSL, no C build tools.
# MIT OR Apache-2.0.
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
# Pure-Rust bzip2 decoder (Cisco serves its files as .bz2). MIT/Apache-2.0.
bzip2-rs = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
