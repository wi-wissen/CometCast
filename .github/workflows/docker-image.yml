# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the server image from the current branch and pushes it as an "edge" image, without a release.
# Manual only (see docs/ci.md). Releases build the versioned multi-arch image in release.yml instead.
name: Docker image (edge)

on:
  workflow_dispatch:
    inputs:
      branding:
        description: 'Branding file below the repository root (empty = branding/default.json, official = branding/cometcast.json)'
        required: false
        default: ''
      push:
        description: 'Push the image to ghcr.io (off = build only)'
        type: boolean
        default: true

permissions: {}

jobs:
  image:
    name: Build cometcast-server (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # id-token and attestations: sign the build provenance attestation of a pushed image (below).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cometcast-server" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to ghcr.io
        if: ${{ inputs.push }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build (and push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            COMETCAST_BRANDING=${{ inputs.branding }}
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.name.outputs.image }}:edge
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=cometcast-server
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
      # Build provenance for the pushed digest (the same as for releases, docs/releasing.md). Verify:
      # gh attestation verify oci://ghcr.io/OWNER/cometcast-server:edge --owner OWNER
      # UNCERTAIN: never run.
      - name: Attest build provenance (signed, pushed to ghcr.io)
        if: ${{ inputs.push }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
