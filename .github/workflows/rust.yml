# SPDX-License-Identifier: GPL-3.0-or-later
name: Rust
on:
  # Switched off while the project is under heavy development, to save Actions minutes:
  # started by hand (Actions tab, Run workflow). Re-enable the push/pull_request triggers
  # (see git history of this file) before a release.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,x86_64-pc-windows-gnu,aarch64-apple-darwin
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The download path (HTTPS client, bzip2) is behind a feature that the workspace build
      # does not enable for cc-codec alone; compile and test it here.
      - run: cargo test -p cc-codec --features download
      - run: cargo clippy -p cc-codec --features download --all-targets -- -D warnings
      - run: cargo check -p cc-ffi --no-default-features --features h264-libloading
      # The Windows Miracast receiver (cc-miracast, cc-miracast-ffi) only compiles its Windows
      # code on Windows targets. Clippy for the gnu target needs no C compiler for these two
      # crates (docs/miracast.md, "What was verified"). Nothing is linked or run.
      - run: cargo clippy -p cc-miracast -p cc-miracast-ffi --target x86_64-pc-windows-gnu --all-targets -- -D warnings
      # The screen capture backends with the system picker: Windows Graphics Capture (windows
      # crate) and ScreenCaptureKit (objc2 crates) only compile their own platform's code. For
      # these two targets a type check and clippy need no SDK and no C compiler (docs/capture.md,
      # "Desktop capture with the system picker"). Nothing is linked or run.
      - run: cargo clippy -p cc-capture --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo clippy -p cc-capture --target aarch64-apple-darwin -- -D warnings
      # cc-proto must stay usable in the browser (WebAssembly).
      - run: cargo check -p cc-proto --target wasm32-unknown-unknown
  # Wayland screen capture (desktop portal + PipeWire, cargo feature `wayland` of cc-capture).
  # Needs the PipeWire development files; the loopback test runs against a real PipeWire daemon
  # with a fake screen producer (tools/pipewire-loopback-test.sh). The portal is not tested.
  wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libclang-dev pipewire wireplumber dbus
      - run: cargo clippy -p cc-capture --features wayland --all-targets -- -D warnings
      - run: cargo test -p cc-capture --features wayland
      - run: tools/pipewire-loopback-test.sh
  # The release variant of the CLI must not contain an OpenH264 source build (docs/capture.md,
  # "H.264 licensing"). The other job builds with the development default `h264-source`.
  release-variant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p cometcast-cli --no-default-features --features h264-libloading
      - name: The dependency graph has no OpenH264 source build
        run: |
          cargo tree -p cometcast-cli --no-default-features --features h264-libloading -e features -i openh264 > tree.txt
          grep -q 'openh264 feature "libloading"' tree.txt
          if grep -E 'openh264 feature "source"|cc-media feature "h264-source"|cc-sender feature "h264-source"' tree.txt; then
            echo "the release variant pulls in the OpenH264 source build" >&2
            exit 1
          fi
      - name: Without COMETCAST_OPENH264_LIB the binary refuses to start the codec
        run: |
          set +e
          out=$(env -u COMETCAST_OPENH264_LIB target/release/cometcast-cli receive --decode --server 127.0.0.1:1 2>&1)
          code=$?
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "built without the h264-source feature"
