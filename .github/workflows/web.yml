name: web

on:
  push:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # UNCERTAIN: this job has not been run on GitHub; it was only verified locally.
  e2e:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # PDF renderer (cc-docs-wasm). UNCERTAIN: these steps were not run on GitHub. The wasm-bindgen CLI
      # must be exactly the version of the wasm-bindgen crate in Cargo.lock (0.2.130 when this was written).
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm run build:wasm
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
      - run: npm run e2e:pdf
        working-directory: apps/web
