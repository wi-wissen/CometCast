# SPDX-License-Identifier: GPL-3.0-or-later
name: Flutter
on:
  # Switched off while the project is under heavy development, to save Actions minutes:
  # started by hand (Actions tab, Run workflow). Re-enable the push/pull_request triggers
  # (see git history of this file) before a release.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      # UNCERTAIN: this workflow has NOT been run on GitHub. Every command below was run
      # locally with Flutter 3.47.9 on Linux (see apps/flutter/README.md); the action
      # versions, the apt package names and the cache settings are untested.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version everything was verified with. UNCERTAIN: the action must find it.
          flutter-version: '3.47.9'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      # Linux desktop build tools (the Flutter Linux runner needs GTK, cmake, ninja, clang).
      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb xterm
      - run: flutter pub get
      - run: flutter gen-l10n
      # The bridge code is committed. This step regenerates it and fails if it is out of date
      # (changed files or new untracked files).
      # UNCERTAIN: the codegen version must match the flutter_rust_bridge version in
      # crates/cc-ffi/Cargo.toml and apps/flutter/pubspec.yaml (2.13.0 today).
      - name: Cache the code generator
        id: codegen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-2.13.0-${{ runner.os }}
      - name: Install the code generator
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Check generated bridge code is up to date
        run: |
          flutter_rust_bridge_codegen generate
          if [ -n "$(git status --porcelain -- . ../../crates/cc-ffi)" ]; then
            git status --porcelain -- . ../../crates/cc-ffi
            git diff -- . ../../crates/cc-ffi | head -50
            exit 1
          fi
      - name: Rust checks for cc-ffi
        working-directory: .
        run: |
          cargo fmt --all -- --check
          cargo clippy -p cc-ffi --all-targets -- -D warnings
          cargo test -p cc-ffi
      - run: flutter analyze
      # The real-library tests in test/rust_core_test.dart need libcc_ffi.so first, and the one
      # that counts PDF pages needs the render worker (cc-docs-worker) next to it. The Miracast
      # binding test (test/miracast_ffi_test.dart) needs libcc_miracast_ffi.so (on Linux the
      # receiver reports "unsupported"; it checks the Dart binding only).
      - name: Build the Rust core for the tests
        working-directory: .
        run: cargo build -p cc-ffi -p cc-docs -p cc-miracast-ffi
      - run: flutter test
      # Builds the Rust core through CMake and bundles it (see docs/flutter-bridge.md).
      - run: flutter build linux --debug
      # Smoke test: real server + real CLI + the built app under a virtual display.
      - name: Smoke test (app + server + CLI)
        working-directory: .
        run: |
          cargo build -p cometcast-server -p cometcast-cli
          target/debug/cometcast-server --listen 127.0.0.1:18443 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          cd apps/flutter
          xvfb-run -a flutter test integration_test/receiver_smoke_test.dart -d linux \
            --dart-define=COMETCAST_TEST_SERVER=127.0.0.1:18443 \
            --dart-define=COMETCAST_CLI=${{ github.workspace }}/target/debug/cometcast-cli
      # Screen test: a real X11 screen (Xvfb + xterm) as H.264 into the app, and out of the app
      # into `cometcast-cli receive --decode`; the test reads the pixels the app drew.
      # UNCERTAIN: not run on GitHub; run locally with the same script (apps/flutter/README.md).
      - name: Screen end-to-end test (app + server + CLI + X11 screen)
        working-directory: .
        run: |
          cargo build -p cc-ffi -p cometcast-server -p cometcast-cli
          cd apps/flutter
          integration_test/run_screen_e2e.sh
      # Content test: images, PDF pages (worker bundled next to the app by the CMake step), links,
      # presenter controls, in both directions against the real CLI.
      # UNCERTAIN: not run on GitHub; run locally with the same script (apps/flutter/README.md).
      - name: Content end-to-end test (app + server + CLI + PDF worker)
        working-directory: .
        run: |
          cargo build --workspace --bins
          cd apps/flutter
          integration_test/run_content_e2e.sh
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      # UNCERTAIN: this job has NOT been run on GitHub. The same commands were run locally
      # (Flutter 3.47.9, JDK 21, Android SDK platform 36, build-tools 36.0.0, NDK 28.2.13676358,
      # cargo-ndk 4.1.2); see docs/android.md. The runner image's preinstalled Android SDK,
      # the action versions and the sdkmanager call are untested.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # The Gradle tasks build into build/cargo-target-android (not target/): cache that too.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> apps/flutter/build/cargo-target-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      # The NDK version must match flutter.ndkVersion of Flutter 3.47.9.
      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      # Builds libcc_ffi.so and the PDF / Office workers (libcc_docs_worker.so,
      # libcc_office_worker.so) for arm64-v8a and armeabi-v7a through cargo-ndk (Gradle tasks
      # cargoNdkDebug and cargoNdkWorkerDebug* in android/app/build.gradle.kts) and packs them.
      # Release builds are NOT made here: without COMETCAST_KEYSTORE* the release type uses the
      # debug key and the Gradle guard checkReleaseSigning fails it unless
      # -PcometcastAllowDebugSigning=true is set (see docs/android.md). Never publish an APK
      # built that way.
      - run: flutter build apk --debug --target-platform android-arm,android-arm64
      - name: Check the APK contains the Rust library
        run: |
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | tee apk-list.txt
          grep -q 'lib/arm64-v8a/libcc_ffi.so' apk-list.txt
          grep -q 'lib/armeabi-v7a/libcc_ffi.so' apk-list.txt
          grep -q 'lib/arm64-v8a/libcc_docs_worker.so' apk-list.txt
          grep -q 'lib/arm64-v8a/libcc_office_worker.so' apk-list.txt
          grep -q 'lib/arm64-v8a/libflutter.so' apk-list.txt
      # The APK build above covers arm64-v8a and armeabi-v7a. x86_64 (emulators, some Chromebooks
      # and TV boxes) is only type-checked: no linking, so it is cheap. UNCERTAIN: not run on GitHub.
      - name: cargo ndk check (x86_64, core only)
        working-directory: .
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk --platform 24 -t x86_64 check -p cc-ffi --target-dir apps/flutter/build/cargo-target-android
      # Google Play requires 16 KB page alignment of native libraries (Android 15+ devices with 16 KB
      # pages). Every shipped .so must have all LOAD segments aligned to >= 0x4000 (p_align).
      - name: Check 16 KB page alignment of the shipped libraries
        run: |
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          readelf="$(ls "$ndk"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -n1)"
          rm -rf apk-libs && mkdir apk-libs
          unzip -q build/app/outputs/flutter-apk/app-debug.apk 'lib/*.so' -d apk-libs
          fail=0
          for f in apk-libs/lib/*/*.so; do
            while read -r align; do
              if [ "$((align))" -lt $((0x4000)) ]; then echo "::error::$f has a LOAD segment with p_align $align (< 0x4000)"; fail=1; fi
            done < <("$readelf" -lW "$f" | awk '$1=="LOAD" {print $NF}')
          done
          exit $fail
      # JVM unit tests of the pure Kotlin helpers (capture size arithmetic, H.264 parsing).
      # UNCERTAIN: not run on GitHub; the same task was run locally (docs/android.md).
      - name: Kotlin unit tests
        working-directory: apps/flutter/android
        run: ./gradlew :app:testDebugUnitTest
