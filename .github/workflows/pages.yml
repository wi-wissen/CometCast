# SPDX-License-Identifier: GPL-3.0-or-later
# Publishes site/ to GitHub Pages (cometcast.de) together with the web app under /app/.
# One-time owner setup: docs/website.md (including "before enabling Pages: fill the imprint").
name: Pages
on:
  # Switched off while the project is under heavy development, to save Actions minutes:
  # started by hand (Actions tab, Run workflow). Re-enable the push/pull_request triggers
  # (see git history of this file) before a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check links of the static site (the web app is added later)
        run: node tools/check-site-links.mjs site --without-app
      - name: Install the Rust toolchain and the wasm target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
      # The wasm-bindgen CLI must be exactly the version of the wasm-bindgen crate in Cargo.lock.
      - name: Install the wasm-bindgen CLI of the version in Cargo.lock
        run: |
          set -euo pipefail
          ver="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          test -n "$ver" || { echo "::error::wasm-bindgen not found in Cargo.lock"; exit 1; }
          cargo install wasm-bindgen-cli --version "$ver" --locked
      - name: Build the web app (PDF renderer and app)
        working-directory: apps/web
        env:
          VITE_BASE: /app/
          VITE_DEFAULT_RELAY: wss://relay.cometcast.de/ws
        run: |
          npm ci
          npm run build:wasm
          npm run build
      - name: Stage site and web app
        run: |
          set -euo pipefail
          rm -rf stage && mkdir stage
          cp -a site/. stage/
          mkdir -p stage/app
          cp -a apps/web/dist/. stage/app/
          test -f stage/app/index.html || { echo "::error::the web app is missing under /app/"; exit 1; }
          test -f stage/app/pdf/cc_docs_wasm_bg.wasm || { echo "::error::the PDF renderer is missing under /app/"; exit 1; }
          test -f stage/.nojekyll
          # The app and universal links of the apps point at cometcast.de/app/{CODE}: the website serves the verification files.
          mkdir -p stage/.well-known
          cp deploy/well-known/assetlinks.json deploy/well-known/apple-app-site-association stage/.well-known/
      - name: Check links of the staged artifact (/app/ must exist now)
        run: node tools/check-site-links.mjs stage
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stage
      - id: deployment
        uses: actions/deploy-pages@v4
