# SPDX-License-Identifier: GPL-3.0-or-later
# Publishes site/ to GitHub Pages (cometcast.de) together with the web app under /app/.
# One-time owner setup: docs/website.md (including "before enabling Pages: fill the imprint").
name: Pages
on:
  # Switched off while the project is under heavy development, to save Actions minutes:
  # started by hand (Actions tab, Run workflow). Re-enable the push/pull_request triggers
  # (see git history of this file) before a release.
  workflow_dispatch:
    inputs:
      require_pages:
        description: 'Fail (instead of skipping the deploy) when GitHub Pages is not enabled for the repository'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Builds the static site and the web app and checks the links. Needs no Pages setting, so it is
  # a real check of the site even where Pages is not enabled.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check links of the static site (the web app is added later)
        run: node tools/check-site-links.mjs site --without-app
      - name: Install the Rust toolchain and the wasm target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
      # The wasm-bindgen CLI must be exactly the version of the wasm-bindgen crate in Cargo.lock.
      - name: Install the wasm-bindgen CLI of the version in Cargo.lock
        run: |
          set -euo pipefail
          ver="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          test -n "$ver" || { echo "::error::wasm-bindgen not found in Cargo.lock"; exit 1; }
          cargo install wasm-bindgen-cli --version "$ver" --locked
      - name: Build the web app (PDF renderer and app)
        working-directory: apps/web
        env:
          VITE_BASE: /app/
          VITE_DEFAULT_RELAY: wss://relay.cometcast.de/ws
        run: |
          npm ci
          npm run build:wasm
          npm run build
      - name: Stage site and web app
        run: |
          set -euo pipefail
          rm -rf stage && mkdir stage
          cp -a site/. stage/
          mkdir -p stage/app
          cp -a apps/web/dist/. stage/app/
          test -f stage/app/index.html || { echo "::error::the web app is missing under /app/"; exit 1; }
          test -f stage/app/pdf/cc_docs_wasm_bg.wasm || { echo "::error::the PDF renderer is missing under /app/"; exit 1; }
          test -f stage/.nojekyll
          # The app and universal links of the apps point at cometcast.de/app/{CODE}: the website serves the verification files.
          mkdir -p stage/.well-known
          cp deploy/well-known/assetlinks.json deploy/well-known/apple-app-site-association stage/.well-known/
      - name: Check links of the staged artifact (/app/ must exist now)
        run: node tools/check-site-links.mjs stage
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stage

  # Owner setting: Settings > Pages > Source must be "GitHub Actions" (docs/website.md). Without
  # it the API answers 404 and actions/configure-pages fails with "Get Pages site failed". That
  # is not a defect of the site, so it is detected here: the deploy is skipped with a visible
  # warning, or fails with a clear message when the dispatch input require_pages is set.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Is GitHub Pages enabled for this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE: ${{ inputs.require_pages }}
        run: |
          set +e
          out="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1)"
          code=$?
          set -e
          msg=""
          if [ "$code" -ne 0 ]; then
            msg="GitHub Pages is not enabled for ${GITHUB_REPOSITORY}. A repository owner must set Settings > Pages > Build and deployment > Source = GitHub Actions (docs/website.md). API answer: ${out}"
          elif [ "$(printf '%s' "$out" | jq -r '.build_type')" != "workflow" ]; then
            msg="GitHub Pages of ${GITHUB_REPOSITORY} is not set to build with GitHub Actions (build_type is $(printf '%s' "$out" | jq -r '.build_type')). Set Settings > Pages > Source = GitHub Actions."
          fi
          if [ -z "$msg" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REQUIRE" = "true" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg The build and link checks passed; the deploy is skipped."
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
