name: i18n
on:
  push:
  pull_request:
jobs:
  check-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/check-i18n.test.mjs
      - run: node tools/check-i18n.mjs
