# SPDX-License-Identifier: GPL-3.0-or-later
name: i18n
on:
  # Switched off while the project is under heavy development, to save Actions minutes:
  # started by hand (Actions tab, Run workflow). Re-enable the push/pull_request triggers
  # (see git history of this file) before a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/check-i18n.test.mjs
      - run: node tools/check-i18n.mjs
