# SPDX-License-Identifier: GPL-3.0-or-later
name: Pinned Rust toolchain
description: >
  Installs one explicit Rust version with rustup and selects it for the rest of the job
  (RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, which says "stable"). The version comes from
  one variable (RUST_VERSION in .github/workflows/release.yml), so a release never silently
  uses a newer compiler than the one that was bumped by hand.
inputs:
  version:
    description: Exact Rust version, for example 1.97.0
    required: true
  targets:
    description: Extra compilation targets, space separated (optional)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: rustup toolchain install
      shell: bash
      env:
        RUST_VERSION: ${{ inputs.version }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        case "$RUST_VERSION" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "::error::rust version must be exact (MAJOR.MINOR.PATCH), got '$RUST_VERSION'"; exit 1 ;;
        esac
        rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
        echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
        if [ -n "$TARGETS" ]; then
          # shellcheck disable=SC2086 # the target list is split on purpose
          rustup target add --toolchain "$RUST_VERSION" $TARGETS
        fi
        rustc "+$RUST_VERSION" -vV
