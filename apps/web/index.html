<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comet Cast</title>
    <meta name="description" content="Comet Cast: share your screen, documents, links and files. Preview build, runs in the browser." />
    <!-- Cross-origin requests (media links) carry no referrer. -->
    <meta name="referrer" content="same-origin" />
    <!--
      Content Security Policy, as a backstop: the app renders names, links and files from other devices.
      Scripts, styles, fonts and workers only from this origin ('wasm-unsafe-eval' for the PDF renderer,
      inline style attributes for Vue). Connections and media stay open, because the relay and media links
      can be any host. frame-ancestors cannot be set in a meta tag: main.ts refuses to run in a frame, and
      cometcast-server also sends the header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; media-src 'self' blob: http: https:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FCFCFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181B21" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
