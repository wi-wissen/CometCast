# Comet Cast Rust workspace.
# A workspace is a group of crates (Rust packages) built together with one Cargo.lock.
[workspace]
resolver = "3"
members = [
    "crates/cc-proto",
    "crates/cc-discovery",
    "crates/cc-transport",
    "crates/cc-media",
    "crates/cc-capture",
    "crates/cc-docs",
    "crates/cc-office",
    "crates/cc-files",
    "crates/cc-sender",
    "crates/cc-receiver",
    "crates/cc-ffi",
    "crates/cc-server",
    "crates/cc-sfu",
    "crates/cc-airplay",
    "bins/cometcast-server",
    "bins/cometcast-cli",
    "xtask",
]

# Values every crate can reuse with `version.workspace = true` etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
# UNCERTAIN: 1.85 is the first release with edition 2024; the real minimum will be
# raised when heavier dependencies (webrtc, axum, ...) are added and measured in CI.
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/wi-wissen/CometCast"
authors = ["Comet Cast contributors"]

# Shared dependency versions. Crates opt in with `serde.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.9"
tokio-tungstenite = "0.29"
# Native WebRTC (async layer on the sans-io `rtc` core). `rtc` is named directly because
# the media types (codecs, RTCP packets) live there; keep both on the same version.
webrtc = "0.21.1"
rtc = "0.21.1"
async-trait = "0.1"
bytes = "1"
# Server hardening (M8). UNCERTAIN: versions are the latest found on crates.io when this
# was written (2026-11); re-check licences with `cargo deny`/review before a release.
toml = "1"
ipnet = { version = "2", features = ["serde"] }
governor = "0.10"
moka = { version = "0.12", features = ["sync"] }
altcha = "1.1"
hmac = "0.13"
sha1 = "0.11"
base64 = "0.23"
# TLS with rustls using the `ring` crypto backend (no C build tools needed).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Native clients: system trust store for wss:// / https:// (UNCERTAIN: not available on Android).
rustls-native-certs = "0.8"
# Our own crates, so they can refer to each other by name.
cc-proto = { path = "crates/cc-proto" }
cc-server = { path = "crates/cc-server" }
cc-transport = { path = "crates/cc-transport" }
cc-receiver = { path = "crates/cc-receiver" }
cc-sender = { path = "crates/cc-sender" }
cc-airplay = { path = "crates/cc-airplay" }
cc-capture = { path = "crates/cc-capture" }
cc-media = { path = "crates/cc-media" }
# Screen capture on X11: pure-Rust protocol implementation (no libxcb, no unsafe in our code).
x11rb = { version = "0.14", default-features = false, features = ["damage", "randr"] }
# H.264 (BSD-2-Clause bindings around Cisco's OpenH264). The build mode is chosen by the
# cc-media features.
openh264 = { version = "0.9", default-features = false }

# Lints every crate inherits with `[lints] workspace = true`.
[workspace.lints.rust]
# No `unsafe` code anywhere, except crates that opt out and say why (cc-ffi).
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Pedantic is intentionally not enabled.
all = { level = "warn", priority = -1 }

# Release build: small and fast binaries (mobile size matters).
[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
