# SPDX-License-Identifier: GPL-3.0-or-later
# Comet Cast Rust workspace.
# A workspace is a group of crates (Rust packages) built together with one Cargo.lock.
[workspace]
resolver = "3"
members = [
    "crates/cc-proto",
    "crates/cc-discovery",
    "crates/cc-transport",
    "crates/cc-codec",
    "crates/cc-media",
    "crates/cc-capture",
    "crates/cc-capture-pw",
    "crates/cc-docs",
    "crates/cc-docs-wasm",
    "crates/cc-office",
    "crates/cc-files",
    "crates/cc-sender",
    "crates/cc-cast",
    "crates/cc-receiver",
    "crates/cc-ffi",
    "crates/cc-ios",
    "crates/cc-server",
    "crates/cc-sfu",
    "crates/cc-airplay",
    "crates/cc-airplay-sender",
    "crates/cc-miracast",
    "crates/cc-miracast-ffi",
    "bins/cometcast-server",
    "bins/cometcast-cli",
    "xtask",
]

# Values every crate can reuse with `version.workspace = true` etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
# UNCERTAIN: raised from 1.88 to 1.92 because hayro 0.8 and 0.9 (cc-docs) declare
# rust-version 1.92 in their crate metadata. Not measured with exactly a 1.92 toolchain
# (development used 1.97; CI uses the stable toolchain).
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/wi-wissen/CometCast"
authors = ["Comet Cast contributors"]

# Shared dependency versions. Crates opt in with `serde.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.9"
tokio-tungstenite = "0.29"
# Native WebRTC (async layer on the sans-io `rtc` core). `rtc` is named directly because
# the media types (codecs, RTCP packets) live there; keep both on the same version.
webrtc = "0.21.1"
rtc = "0.21.1"
async-trait = "0.1"
bytes = "1"
# Server hardening (M8). UNCERTAIN: versions are the latest found on crates.io when this
# was written (2026-11); re-check licences with `cargo deny`/review before a release.
toml = "1"
ipnet = { version = "2", features = ["serde"] }
governor = "0.10"
moka = { version = "0.12", features = ["sync"] }
altcha = "1.1"
hmac = "0.13"
sha1 = "0.11"
base64 = "0.23"
# Signed display announcements (cc-discovery). Minimal features: no `rand_core`, keys come from
# the caller. BSD-3-Clause; already in the tree through cc-airplay-sender.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
sha2 = "0.11"
# TLS with rustls using the `ring` crypto backend (no C build tools needed).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
# Timer for hyper's HTTP/1 header read timeout (already in the tree through axum).
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Native clients: system trust store for wss:// / https:// (UNCERTAIN: not available on Android).
rustls-native-certs = "0.8"
# DNS-SRV lookup (cc-discovery). UNCERTAIN: 0.26.3 was the newest version found on crates.io
# when this was written (2026-11); licence MIT OR Apache-2.0 (from the crate metadata).
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
mdns-sd = "0.21"
# Our own crates, so they can refer to each other by name.
cc-proto = { path = "crates/cc-proto" }
cc-server = { path = "crates/cc-server" }
cc-transport = { path = "crates/cc-transport" }
cc-receiver = { path = "crates/cc-receiver" }
cc-discovery = { path = "crates/cc-discovery" }
# default-features = false: the H.264 build mode (OpenH264 from source or the prebuilt
# library) is chosen by the program crate, see bins/cometcast-cli/Cargo.toml and docs/capture.md.
cc-sender = { path = "crates/cc-sender", default-features = false }
cc-airplay = { path = "crates/cc-airplay" }
cc-airplay-sender = { path = "crates/cc-airplay-sender", default-features = false }
cc-capture = { path = "crates/cc-capture" }
cc-media = { path = "crates/cc-media", default-features = false }
# Finds and downloads Cisco's OpenH264 library at run time. Default features off: only the
# lookup (no HTTP client); the program that offers the download (cc-ffi) turns `download` on.
cc-codec = { path = "crates/cc-codec", default-features = false }
# Screen capture on X11: pure-Rust protocol implementation (no libxcb, no unsafe in our code).
x11rb = { version = "0.14", default-features = false, features = ["damage", "randr"] }
# H.264 (BSD-2-Clause bindings around Cisco's OpenH264). The build mode is chosen by the
# cc-media features.
openh264 = { version = "0.9", default-features = false }
cc-miracast = { path = "crates/cc-miracast" }
cc-cast = { path = "crates/cc-cast", default-features = false }
cc-docs = { path = "crates/cc-docs" }
cc-files = { path = "crates/cc-files" }
cc-office = { path = "crates/cc-office" }
# PDF rendering (cc-docs). Pure Rust, Apache-2.0 OR MIT; needs Rust 1.92 (see rust-version above).
hayro = "0.9"
# Pure-Rust image encoders for rendered pages (cc-docs): PNG and lossless WebP. No C code.
png = "0.18"
image-webp = "0.2"
# Decoding PNG/WebP/GIF/JPEG and encoding JPEG for photos sent to AirPlay TVs (cc-airplay-sender). Pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Inflate pre-scan in cc-docs (pure Rust miniz_oxide backend, no C code). Tests use it too.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Lints every crate inherits with `[lints] workspace = true`.
[workspace.lints.rust]
# No `unsafe` code anywhere, except crates that opt out and say why (cc-ffi).
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Pedantic is intentionally not enabled.
all = { level = "warn", priority = -1 }

# Release build: small and fast binaries (mobile size matters).
[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1

# The H.264 code is C++ that would be very slow at opt-level 0 (tests, debug runs).
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.cc-capture]
opt-level = 3
[profile.dev.package.cc-media]
opt-level = 3
# cc-ffi scales and converts every received picture (pixel loops); at opt-level 0 that took
# most of the time per frame in the Flutter debug build.
[profile.dev.package.cc-ffi]
opt-level = 3

# mdns-sd 0.21.7 with two public setters for the record lifetime (vendor/mdns-sd/COMETCAST-PATCH.md).
# Remove this when a released mdns-sd has them.
[patch.crates-io]
mdns-sd = { path = "vendor/mdns-sd" }
