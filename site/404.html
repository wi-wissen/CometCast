<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page not found / 404 - Seite nicht gefunden</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/style.css">
<script>
// GitHub Pages answers every unknown path with this page. Under /app/ that means a join link (/app/K7QM2W) or
// /app/display of the web app, which chooses its page by the path: show the app's index.html here, the address stays.
// Every other path keeps this 404 page. (docs/website.md)
(function () {
  if (!/^\/app(\/|$)/.test(location.pathname)) return;
  document.documentElement.style.visibility = 'hidden';
  fetch('/app/index.html', { credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error('no app'); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { document.documentElement.style.visibility = ''; });
})();
</script>
</head>
<body class="notfound">
<main id="main"><div class="wrap narrow doc">
<a class="brand" href="/"><picture><source srcset="/assets/cometcast-logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="/assets/cometcast-logo-light.svg" alt="Comet Cast logo: a comet shaped like a C" width="40" height="40"></picture><span>Comet Cast</span></a>
<h1>404</h1>
<p class="lead" lang="en">This page does not exist. <a href="/">Back to the home page</a>.</p>
<p class="lead" lang="de">Diese Seite gibt es nicht. <a href="/de/">Zur Startseite</a>.</p>
</div></main>
</body>
</html>
