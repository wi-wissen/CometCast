[package]
name = "cometcast-cli"
description = "Comet Cast cli program"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
cc-airplay.workspace = true
cc-docs.workspace = true
cc-files.workspace = true
cc-office.workspace = true
cc-cast.workspace = true
cc-airplay-sender.workspace = true
cc-miracast.workspace = true
cc-proto.workspace = true
cc-discovery.workspace = true
cc-receiver.workspace = true
cc-sender.workspace = true
cc-transport.workspace = true
tokio.workspace = true
cc-media.workspace = true

[features]
# How the H.264 code (OpenH264) gets into the program. See docs/capture.md, "H.264 licensing".
#
# * `h264-source` compiles OpenH264 from source: needs g++ and nasm, convenient for development
#   and CI, but NOT for releases (UNCERTAIN: patent licence, see docs/capture.md).
# * `h264-libloading` loads Cisco's prebuilt library from COMETCAST_OPENH264_LIB at run time.
#
# Release build, without any OpenH264 source build:
#   cargo build --release -p cometcast-cli --no-default-features --features h264-libloading
default = ["h264-source"]
h264-source = ["cc-media/h264-source", "cc-sender/h264-source", "cc-cast/h264-source", "cc-airplay-sender/h264-source"]
h264-libloading = ["cc-media/h264-libloading", "cc-sender/h264-libloading", "cc-cast/h264-libloading", "cc-airplay-sender/h264-libloading"]

[dev-dependencies]
flate2.workspace = true
