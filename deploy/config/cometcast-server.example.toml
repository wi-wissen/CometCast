# Comet Cast server: example configuration for the Docker setup in deploy/.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Copy to deploy/config/cometcast-server.toml and edit. `cometcast-server
# --print-default-config` prints every setting with its default.
# UNCERTAIN: all numbers are untested placeholders. Host names are examples.

mode = "internal"
# In a container the listen address comes from COMETCAST_LISTEN (see the Dockerfile).

[tls]
# Real certificate and key (PEM), mounted by docker-compose.yml from deploy/certs/.
# Leave both out when a reverse proxy in front of the server does TLS.
cert_file = "/etc/cometcast/certs/fullchain.pem"
key_file = "/etc/cometcast/certs/privkey.pem"

[network]
# Only if a reverse proxy runs in front: its address. Then X-Forwarded-For is believed
# from it and from nobody else.
# trusted_proxies = ["172.16.0.0/12"]
# Networks of the organisation. Empty = everybody may connect.
# allow = ["10.0.0.0/8", "192.168.0.0/16"]

[altcha]
# "optional": only checked when the client sends a solution.
# Use "always" to require it for create_room.
mode = "optional"
# Fixed secret so puzzles survive a restart and work across several server instances:
# secret_file = "/run/secrets/altcha_secret"

# TURN credentials at GET /ice-servers. Secret = same value as in coturn.
[turn]
urls = ["turn:relay.example.org:3478?transport=udp", "turns:relay.example.org:5349?transport=tcp"]
stun_urls = ["stun:relay.example.org:3478"]
secret_file = "/run/secrets/turn_secret"
ttl_secs = 3600
